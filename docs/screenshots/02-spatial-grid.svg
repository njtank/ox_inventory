  <line x1="1111" y1="331" x2="1509" y2="331" stroke="#15333a"/><text x="1140" y="360" fill="#edf8f8" font-family="Arial,sans-serif" font-size="14">• Items occupy physical cells</text><text x="1140" y="415" fill="#edf8f8" font-family="Arial,sans-serif" font-size="14">• R rotates the selected footprint</text><text x="1140" y="470" fill="#779097" font-family="Arial,sans-serif" font-size="14">• Overlap is rejected server-side</text><text x="1140" y="525" fill="#779097" font-family="Arial,sans-serif" font-size="14">• Out-of-bounds placement is rejected</text><text x="1140" y="580" fill="#779097" font-family="Arial,sans-serif" font-size="14">• Full physical grid returns inventory_full</text><text x="1140" y="635" fill="#779097" font-family="Arial,sans-serif" font-size="14">• Transfers into pockets obey the same rules</text><text x="1310" y="704" text-anchor="middle" fill="#66d9e8" font-family="Arial" font-size="76" font-weight="bold">R</text><text x="1310" y="750" text-anchor="middle" fill="#edf8f8" font-family="Arial" font-size="16">2×5 → 5×2</text>
